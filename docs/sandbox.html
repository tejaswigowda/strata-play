<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strata game (sandbox)</title>
<!--
	Defense-in-depth on top of origin isolation (work order §4.1): opaque
	origin already makes host secrets unreachable, this just shrinks what a
	malicious game could exfiltrate TO. Every fetch-capable directive is listed
	EXPLICITLY (never left to the default-src 'none' fallback) so the policy's
	actual reach is auditable at a glance, not implicit — an img-src-only fix
	would still leave an exfil channel open via <video>/<audio src> (media-src)
	or @font-face (font-src) if either were ever left unset. connect-src is the
	two CDN backends git-resolver.js ever talks to (any GitHub-hosted game
	resolves through one of these two), plus blob: — GLTFLoader decodes a
	GLB's embedded textures by creating a blob: URL and fetching it internally
	(same-document content, never a network exfil vector) — nothing else.
	blob: in script-src is the entry-module import (see loadEntry below);
	'unsafe-inline' covers this page's own inline scripts/styles (no
	per-request nonce is possible on plain static hosting). frame-src,
	form-action, base-uri, object-src stay 'none' — a sandboxed game never
	legitimately opens a frame, submits a form, or changes its own base/plugin
	surface, so 'none' is strictly tighter than the self/data/CDN allowlist
	used for the asset-loading directives and must never be loosened to match.
-->
<meta http-equiv="Content-Security-Policy" content="
	default-src 'none';
	script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net;
	connect-src 'self' blob: https://cdn.jsdelivr.net https://raw.githubusercontent.com;
	img-src 'self' data: blob: https://cdn.jsdelivr.net https://raw.githubusercontent.com;
	media-src 'self' data: blob: https://cdn.jsdelivr.net https://raw.githubusercontent.com;
	font-src 'self' data: blob: https://cdn.jsdelivr.net https://raw.githubusercontent.com;
	style-src 'self' 'unsafe-inline';
	form-action 'none';
	base-uri 'none';
	object-src 'none';
	frame-src 'none';
">
<style>
	html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
	canvas { display: block; width: 100%; height: 100%; touch-action: none; }
	#boot-error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;

		background: rgba(0,0,0,0.35); animation: strata-gate-pulse 1.6s ease-in-out infinite; }

</style>
<!--
	Pinned runtime stack — covenant #2 ("outlasts the engine" needs frozen
	deps). Exact versions, never @latest. Raycaster ships as part of three
	itself; cannon-es is mapped here but only actually imported by the boot
	script below when the loaded scene's own labels need physics (auto-

-->

<body>
	<div id="boot-error"></div>
	<!--
		This document is the UNTRUSTED half of the app. It is only ever loaded
		via <iframe sandbox="allow-scripts"> (no allow-same-origin) from
		index.html, which gives it an opaque origin: no access to the host's
		localStorage/cookies, no access to window.parent's DOM. Everything it
		needs (which repo/ref, the game's own .glb path) arrives over
		postMessage from play.js — there is no separate manifest file; a game
		repo is just <basename>.glb + <basename>.js.

		Everything below is ONE inline module script, not `src="runtime.js"` —
		deliberately. An opaque-origin document treats even a fetch back to
		its OWN host as cross-origin, so a separate same-origin script file
		would need this repo's server to send Access-Control-Allow-Origin on
		every response (most plain static servers — VS Code Live Server/Live
		Preview, `python -m http.server`, GitHub Pages defaults, etc. — don't).
		Inlining sidesteps that: this code arrives as part of the document
		itself (a normal navigation, never subject to CORS), so strata-play
		works on ANY static host without special headers, exactly like
		strata-editor (which sidesteps the same class of problem by simply not
		sandboxing). The `import`s below for three/cannon-es/3dom are
		unaffected either way — those are genuine cross-origin CDN fetches
		that already send Access-Control-Allow-Origin.

		For the SAME reason, `resolveAssetBytes` here is a deliberately
		duplicated, trimmed copy of lib/git-resolver.js's function (that file
		remains the canonical version — imported normally by play.js, which
		runs in the host's ordinary, non-opaque origin and never hits this
		problem). Keep the two in sync by hand if the resolver's fetch logic
		changes; see that file for the fuller version (scene-index lookup,
		offline cache fallback) this one intentionally omits.
	-->
	<script type="module">

	// ── Asset resolver (trimmed mirror of lib/git-resolver.js) ────────────────
	function encodePath( path ) {

		return path.split( '/' ).map( encodeURIComponent ).join( '/' );

	}

	function jsdelivrUrl( owner, repo, ref, path ) {

		return `https://cdn.jsdelivr.net/gh/${ owner }/${ repo }@${ ref }/${ encodePath( path ) }`;

	}

	function rawUrl( owner, repo, ref, path ) {

		return `https://raw.githubusercontent.com/${ owner }/${ repo }/${ ref }/${ encodePath( path ) }`;

	}

	function backendsFor( mode ) {

		return mode === 'present' ? [ jsdelivrUrl, rawUrl ] : [ rawUrl, jsdelivrUrl ];

	}

	async function fetchFromCdn( url, attempt ) {

		let res;
		try {

			res = await fetch( url, { cache: 'no-store' } );

		} catch ( e ) {

			// A transient network hiccup (cold DNS, a dropped connection, a
			// momentary CDN edge failure) rejects fetch() itself rather than
			// resolving with a bad status — retry once after a short backoff
			// before giving up on this URL, since a first paint is exactly when
			// this kind of blip is most visible (cold connection, cold caches).
			if ( ! attempt ) { await new Promise( ( r ) => setTimeout( r, 400 ) ); return fetchFromCdn( url, 1 ); }
			throw new Error( `network error fetching ${ url } — ${ e.message }` );

		}

		if ( ! res.ok ) throw new Error( `HTTP ${ res.status } at ${ url }` );
		return res;

	}

	// Deliberately no apiFetch fallback — api.github.com never enters this path.
	async function resolveFirst( owner, repo, refs, path, mode ) {

		const backends = backendsFor( mode );
		const attempts = [];

		for ( const ref of refs ) {

			for ( const build of backends ) {

				try { return { res: await fetchFromCdn( build( owner, repo, ref, path ) ), ref }; }
				catch ( e ) { attempts.push( `${ ref }: ${ e.message }` ); }

			}

		}

		// Every (ref, backend) combination failed — say which refs were
		// actually tried, not just the last one, so a repo with only "main"
		// (no "master") never reads as "it assumed master and gave up" when
		// main was tried too and the file just isn't there on either.
		attempts.forEach( ( a ) => console.warn( `strata-play: ${ path } — ${ a }` ) );
		throw new Error( `"${ path }" not found on ${ refs.join( ' or ' ) }` );

	}

	async function resolveAssetBytes( { owner, repo, ref, path, mode } ) {

		const refs = ref ? [ ref ] : [ 'main', 'master' ];
		const { res } = await resolveFirst( owner, repo, refs, path, mode );
		return new Uint8Array( await res.arrayBuffer() );

	}

	// ── Embedded bundled examples ─────────────────────────────────────────────

	// reason as everything else on this page — the "no #repo= hash" default
	// path (and #example=… picking a different bundled one, e.g. the §1.5
	// red-team game) must never need a same-origin fetch either. Canonical
	// source stays examples/<name>/*; regenerate this object with
	// `node scripts/embed-examples.mjs` after editing any example's game.js or
	// scene.glb.
	/* EMBEDDED_EXAMPLES:START */
	const EMBEDDED_EXAMPLES = {"hello":{"gameJs":"// ── game.js ──────────────────────────────────────────────────────────────────\n// The seed example's entry module — plain JS against the ctx contract, no\n// 3DOM extension. A game repo is just two files: this and game.glb — the\n// entry's filename always matches the scene's own basename with a .js\n// extension (auto-resolved, no separate manifest). Click each `.coin` to\n// collect it (it hides, state.score++); once all three are collected, `#door`\n// slides open.\n//\n// This is the pattern any game entry follows: default-export init(ctx), wire\n// input, register onFrame for anything that animates, read/write ctx.state.\n\nexport default function init( ctx ) {\n\n\tconst { $S, input, onFrame, state } = ctx;\n\n\tstate.score = 0;\n\tstate.doorOpen = false;\n\n\tconst TOTAL_COINS = $S( '.coin' ).count;\n\tconst doorOpenDistance = 2.2; // units to slide up before considering the door \"open\"\n\tlet doorAnimating = false;\n\n\tinput.onPointer( ( ev ) => {\n\n\t\tif ( ev.type !== 'down' ) return;\n\n\t\tconst ray = input.pointerRay();\n\t\tif ( ! ray ) return;\n\n\t\tconst coins = $S( '.coin' ).toArray().filter( ( n ) => n.visible );\n\t\tif ( coins.length === 0 ) return;\n\n\t\tconst hits = ray.intersectObjects( coins, false );\n\t\tif ( hits.length === 0 ) return;\n\n\t\t$S( [ hits[ 0 ].object ] ).setVisible( false );\n\t\tstate.score ++;\n\n\t\tif ( state.score >= TOTAL_COINS && ! state.doorOpen ) {\n\n\t\t\tstate.doorOpen = true;\n\t\t\tdoorAnimating = true;\n\n\t\t}\n\n\t} );\n\n\tonFrame( ( dt ) => {\n\n\t\tif ( ! doorAnimating ) return;\n\n\t\tconst door = $S( '#door' ).toArray()[ 0 ];\n\t\tif ( ! door ) { doorAnimating = false; return; }\n\n\t\tif ( door.userData._openTravel === undefined ) door.userData._openTravel = 0;\n\n\t\tconst step = dt * 1.4;\n\t\tconst remaining = doorOpenDistance - door.userData._openTravel;\n\n\t\tif ( remaining <= 0 ) { doorAnimating = false; return; }\n\n\t\tconst move = Math.min( step, remaining );\n\t\t$S( [ door ] ).move( 0, move, 0 );\n\t\tdoor.userData._openTravel += move;\n\n\t} );\n\n}\n","sceneB64":"Z2xURgIAAABoCAAA7AQAAEpTT057ImFzc2V0Ijp7InZlcnNpb24iOiIyLjAiLCJnZW5lcmF0b3IiOiJzdHJhdGEtcGxheSBidWlsZC1zY2VuZS5tanMifSwic2NlbmUiOjAsInNjZW5lcyI6W3sibm9kZXMiOlswLDEsMiwzXX1dLCJub2RlcyI6W3sibmFtZSI6IkNvaW4gMSIsIm1lc2giOjAsInRyYW5zbGF0aW9uIjpbLTEuNCwwLjUsMF0sInNjYWxlIjpbMC4zNSwwLjM1LDAuMzVdfSx7Im5hbWUiOiJDb2luIDIiLCJtZXNoIjowLCJ0cmFuc2xhdGlvbiI6WzAsMC41LDBdLCJzY2FsZSI6WzAuMzUsMC4zNSwwLjM1XX0seyJuYW1lIjoiQ29pbiAzIiwibWVzaCI6MCwidHJhbnNsYXRpb24iOlsxLjQsMC41LDBdLCJzY2FsZSI6WzAuMzUsMC4zNSwwLjM1XX0seyJuYW1lIjoiRG9vciIsIm1lc2giOjEsInRyYW5zbGF0aW9uIjpbMCwxLC0yLjJdLCJzY2FsZSI6WzEuNCwyLDAuMjVdfV0sIm1lc2hlcyI6W3sibmFtZSI6IkNvaW5HZW9tIiwicHJpbWl0aXZlcyI6W3siYXR0cmlidXRlcyI6eyJQT1NJVElPTiI6MCwiTk9STUFMIjoxfSwibWF0ZXJpYWwiOjB9XX0seyJuYW1lIjoiRG9vckdlb20iLCJwcmltaXRpdmVzIjpbeyJhdHRyaWJ1dGVzIjp7IlBPU0lUSU9OIjowLCJOT1JNQUwiOjF9LCJtYXRlcmlhbCI6MX1dfV0sIm1hdGVyaWFscyI6W3sibmFtZSI6IkNvaW4iLCJkb3VibGVTaWRlZCI6dHJ1ZSwicGJyTWV0YWxsaWNSb3VnaG5lc3MiOnsiYmFzZUNvbG9yRmFjdG9yIjpbMSwwLjg0LDAuMiwxXSwibWV0YWxsaWNGYWN0b3IiOjAuNiwicm91Z2huZXNzRmFjdG9yIjowLjM1fX0seyJuYW1lIjoiRG9vciIsImRvdWJsZVNpZGVkIjp0cnVlLCJwYnJNZXRhbGxpY1JvdWdobmVzcyI6eyJiYXNlQ29sb3JGYWN0b3IiOlswLjQsMC4yNSwwLjE1LDFdLCJtZXRhbGxpY0ZhY3RvciI6MC4wNSwicm91Z2huZXNzRmFjdG9yIjowLjg1fX1dLCJhY2Nlc3NvcnMiOlt7ImJ1ZmZlclZpZXciOjAsImNvbXBvbmVudFR5cGUiOjUxMjYsImNvdW50IjozNiwidHlwZSI6IlZFQzMiLCJtaW4iOlstMC41LC0wLjUsLTAuNV0sIm1heCI6WzAuNSwwLjUsMC41XX0seyJidWZmZXJWaWV3IjoxLCJjb21wb25lbnRUeXBlIjo1MTI2LCJjb3VudCI6MzYsInR5cGUiOiJWRUMzIn1dLCJidWZmZXJWaWV3cyI6W3siYnVmZmVyIjowLCJieXRlT2Zmc2V0IjowLCJieXRlTGVuZ3RoIjo0MzIsInRhcmdldCI6MzQ5NjJ9LHsiYnVmZmVyIjowLCJieXRlT2Zmc2V0Ijo0MzIsImJ5dGVMZW5ndGgiOjQzMiwidGFyZ2V0IjozNDk2Mn1dLCJidWZmZXJzIjpbeyJieXRlTGVuZ3RoIjo4NjR9XX0gICBgAwAAQklOAAAAAL8AAAC/AAAAPwAAAD8AAAC/AAAAPwAAAD8AAAA/AAAAPwAAAL8AAAC/AAAAPwAAAD8AAAA/AAAAPwAAAL8AAAA/AAAAPwAAAD8AAAC/AAAAvwAAAL8AAAC/AAAAvwAAAL8AAAA/AAAAvwAAAD8  DERIVED from the loaded scene's own labelled bounds\n// (Box3().setFromObject — same pattern examples/bubbles already used), never\n// hardcoded, so this SAME file also drives a differently-sized court with no\n// changes — the proof that \"one logic, many scenes\" is real, not just\n// claimed. `requires` lets the host validate a scene is actually compatible\n// before init() ever runs, instead of a silent dead canvas.\n\nexport const requires = [ '#Court', '#PlayerPaddle', '#AIPaddle', '#Ball' ];\n\nexport default function init( ctx ) {\n\n\tconst { THREE, $S, input, onFrame, onReset, state, getBody } = ctx;\n\n\tconst court = $S( '#Court' ).toArray()[ 0 ];\n\tconst player = $S( '#PlayerPaddle' ).toArray()[ 0 ];\n\tconst ai = $S( '#AIPaddle' ).toArray()[ 0 ];\n\tconst ball = $S( '#Ball' ).toArray()[ 0 ];\n\tconst ballBody = getBody( ball );\n\n\tconst courtBox = new THREE.Box3().setFromObject( court );\n\tconst paddleSize = new THREE.Box3().setFromObject( player ).getSize( new THREE.Vector3() );\n\tconst ballRadius = new THREE.Box3().setFromObject( ball ).getSize( new THREE.Vector3() ).x / 2;\n\n\tconst HALF_WIDTH = courtBox.max.x - paddleSize.x / 2; // paddle travel clamp along X — stops exactly at the walls\n\tconst PLAYER_SPEED = 5;      // units/sec — gameplay pacing, not a scene dimension, stays authored\n\tconst AI_SPEED = 2.6;        // capped below the player's — beatable\n\tconst SERVE_SPEED = 3.5;\n\t// Just past each paddle's OWN far edge (its Z position + half-depth) plus\n\t// a ball's width of clearance — scales with the scene, never hardcoded.\n\tconst OUT_OF_BOUNDS_Z = Math.abs( player.position.z ) + paddleSize.z / 2 + ballRadius * 2;\n\n\tstate.scorePlayer = 0;\n\tstate.scoreAI = 0;\n\n\tfunction serve( towardPlayer ) {\n\n\t\tball.position.set( 0, ball.position.y, 0 );\n\t\tballBody.position.set( 0, ball.position.y, 0 );\n\t\tballBody.velocity.set( ( Math.random() * 2 - 1 ) * 0.6 * SERVE_SPEED, 0, ( towardPlayer ? 1 : - 1 ) * SERVE_SPEED );\n\t\tballBody.angularVelocity.set( 0, 0, 0 );\n\n\t}\n\n\tonReset( () => { state.scorePlayer = 0; state.scoreAI = 0; serve( true ); } );\n\n\tserve( true );\n\n\tonFrame( ( dt ) => {\n\n\t\t// Player input — arrow keys / A-D (a touch/pointer drag falls back to\n\t\t// the SAME axis() call; see sandbox.html's makeInput).\n\t\tconst axis = input.axis( [ 'ArrowLeft', 'KeyA' ], [ 'ArrowRight', 'KeyD' ] );\n\t\tplayer.position.x = Math.max( - HALF_WIDTH, Math.min( HALF_WIDTH, player.position.x + axis * PLAYER_SPEED * dt ) );\n\n\t\t// AI: lerp toward the ball, clamped + speed-capped (beatable). No ML.\n\t\tconst diff = ball.position.x - ai.position.x;\n\t\tconst step = Math.max( - AI_SPEED * dt, Math.min( AI_SPEED * dt, diff ) );\n\t\tai.position.x = Math.max( - HALF_WIDTH, Math.min( HALF_WIDTH, ai.position.x + step ) );\n\n\t\t// Score + deterministic reset once the ball passes a paddle's Z plane.\n\t\tif ( ball.position.z > OUT_OF_BOUNDS_Z ) { state.scoreAI ++; serve( false ); }\n\t\telse if ( ball.position.z < - OUT_OF_BOUNDS_Z ) { state.scorePlayer ++; serve( true ); }\n\n\t} );\n\n}\n","sceneB64":"Z2xURgIAAACADAAABAkAAEpTT057ImFzc2V0Ijp7InZlcnNpb24iOiIyLjAiLCJnZW5lcmF0b3IiOiJzdHJhdGEtcGxheSBidWlsZC1zY2VuZS5tanMgKHBvbmcpIn0sInNjZW5lIjowLCJzY2VuZXMiOlt7Im5vZGVzIjpbMCwxLDIsMyw0LDVdfV0sIm5vZGVzIjpbeyJuYW1lIjoiQ291cnQiLCJtZXNoIjowLCJ0cmFuc2xhdGlvbiI6WzAsLTAuMSwwXSwic2NhbGUiOls2LDAuMiwxMF0sImV4dHJhcyI6eyJjbGFzc2VzIjpbInN0YXRpYyJdfX0seyJuYW1lIjoiV2FsbCAxIiwibWVzaCI6MSwidHJhbnNsYXRpb24iOlstMy4xLDAuNSwwXSwic2NhbGUiOlswLjIsMSwxMF0sImV4dHJhcyI6eyJjbGFzc2VzIjpbInN0YXRpYyJdfX0seyJuYW1lIjoiV2FsbCAyIiwibWVzaCI6MSwidHJhbnNsYXRpb24iOlszLjEsMC41LDBdLCJzY2FsZSI6WzAuMiwxLDEwXSwiZXh0cmFzIjp7ImNsYXNzZXMiOlsic3RhdGljIl19fSx7Im5hbWUiOiJQbGF5ZXJQYWRkbGUiLCJtZXNoIjoyLCJ0cmFuc2xhdGlvbiI6WzAsMC4yNSw0LjVdLCJzY2FsZSI6WzEsMC41LDAuM10sImV4dHJhcyI6eyJjbGFzc2VzIjpbImtpbmVtYXRpYyJdfX0seyJuYW1lIjoiQUlQYWRkbGUiLCJtZXNoIjozLCJ0cmFuc2xhdGlvbiI6WzAsMC4yNSwtNC41XSwic2NhbGUiOlsxLDAuNSwwLjNdLCJleHRyYXMiOnsiY2xhc ndmark\"; a richer rig repeats\n// this same pivot-with-a-child-mesh shape one level deeper per joint, same\n// $S-addressing throughout, no 3DOM extension either way.\n\nexport const requires = [ '#RightShoulder', '#LeftShoulder', 'input:pose' ];\n\nexport default function init( ctx ) {\n\n\tconst { THREE, $S, onFrame } = ctx;\n\n\tconst rightShoulder = $S( '#RightShoulder' ).toArray()[ 0 ];\n\tconst leftShoulder = $S( '#LeftShoulder' ).toArray()[ 0 ];\n\n\t// The rest pose (see build-scene.mjs) hangs each arm straight down in the\n\t// pivot's own local space — aiming the bone at a landmark means finding\n\t// the rotation that carries THIS vector to the live shoulder→wrist\n\t// direction, never an incremental/relative one (the exact\n\t// quaternion-accumulation bug documented for this repo's own tennis\n\t// game — see memory notes — always use an ABSOLUTE rotation here).\n\tconst REST_DOWN = new THREE.Vector3( 0, - 1, 0 );\n\n\t// MediaPipe's landmark space is image pixels normalized to 0..1 (x right,\n\t// y DOWN, z roughly \"closer to camera is more negative\") — not three.js\n\t// world space (y up). Flips y (image-down -> world-up) and z (so reaching\n\t// toward the camera swings the arm toward the viewer, not away).\n\tfunction landmarkDelta( from, to ) {\n\n\t\treturn new THREE.Vector3( to.x - from.x, - ( to.y - from.y ), - ( to.z - from.z ) );\n\n\t}\n\n\tfunction findLandmark( pose, name ) {\n\n\t\treturn pose.find( ( lm ) => lm.name === name ) || null;\n\n\t}\n\n\tfunction aimShoulder( pivot, shoulderName, wristName, pose ) {\n\n\t\tconst shoulder = findLandmark( pose, shoulderName );\n\t\tconst wrist = findLandmark( pose, wristName );\n\t\tif ( ! shoulder || ! wrist ) return; // this landmark pair isn't visible this frame — leave the arm where it was, don't snap to a default\n\n\t\tconst dir = landmarkDelta( shoulder, wrist );\n\t\tif ( dir.lengthSq() < 1e-6 ) return; // shoulder and wrist reported at the same point — no reliable direction yet\n\t\t 	// ── Logic resolution (work order §1) — a scene names its own logic by

	// ── Device-abstracted input (pointer + keyboard) ───────────────────────────
	// "Named actions/axes; device-adaptive" (work order §3) — kept lean: raw
	// onPointer/onKey/pointerRay for anything bespoke, plus isDown(code) and a
	// held-keys axis with a pointer-drag fallback so the SAME axis() call

			axis: ( negCodes, posCodes ) => {

			// the reference; MIDI/gamepad/phone-IMU/second-player-pose reuse
			// this exact same surface later. channel defaults to 'default'
			// (the only channel the wire protocol's ctx-facing sugar below
			// ever needs; a provider sending multiple channels is still
			// reachable via the raw `(provider, channel)` key in providerSamples,
			// just not through this convenience layer).

	//                  the other way around)

		) );

	}

	// ── Boot ────────────────────────────────────────────────────────────────────
	// ── Boot ────────────────────────────────────────────────────────────────────
	// Split in two: the renderer/camera/canvas/audio/gate/pause/animation-loop
	// below run exactly ONCE per sandbox document (see `bootedOnce` at the
	// bottom) — every LATER strata:init (the menu's Code-tab Save action posts
	// one straight to this already-running document, no iframe reload — see
	// play.js's saveCode()) only re-runs loadGame() below: fetch + parse the

	// exactly why ctx.onResize/ctx.onCleanup exist — a re-init reuses the same

	}

	// §2 — declarative HUD: absorbs the "texture a labeled panel with a

				panelCanvas.height = height;

		const blobUrl = URL.createObjectURL( new Blob( [ entryText ], { type: 'text/javascript' } ) );
		let mod;
		try { mod = await import( /* @vite-ignore */ blobUrl ); }
		finally { URL.revokeObjectURL( blobUrl ); }

		if ( typeof mod.default !== 'function' ) throw new Error( `${ entryPath }: default export must be a function init(ctx)` );

		// §2 the label contract (extended by the pose-input-provider work order
		// §3) — logic declares what it needs via an optional
		// `export const requires = ['#Ball', 'input:pose', …]`; a plain
		// selector is a LABEL requirement (validated against the scene that
		// JUST loaded, as before); an `input:X` entry is a PROVIDER requirement
		// (validated against what THIS host actually has configured, supplied
		// in the strata:init handshake) — both checked here, before init() ever
		// runs, so either kind of mismatch is a clear, named message instead of
		// a silent dead game three steps later.
		if ( Array.isArray( mod.requires ) ) {

			const hostProviders = Array.isArray( providers ) ? providers : [];
			const providerReqs = mod.requires.filter( ( r ) => r.startsWith( 'input:' ) ).map( ( r ) => r.slice( 'input:'.length ) );
			const labelReqs = mod.requires.filter( ( r ) => ! r.startsWith( 'input:' ) );

			const missingLabels = labelReqs.filter( ( sel ) => ! $S( sel ).exists );
			const missingProviders = providerReqs.filter( ( p ) => ! hostProviders.includes( p ) );

			if ( missingLabels.length || missingProviders.length ) {

				const parts = [
					...missingLabels,
					...missingProviders.map( ( p ) => `input:${ p } (no provider configured on this host)` ),
				];
				throw new Error( `this scene can't run ${ entryPath } — missing ${ parts.join( ', ' ) }` );

			}

			// Only now, once confirmed available, ask the host to actually start
			// it (opens the camera for 'pose', etc.) — never eager for a game
			// that didn't ask.
			for ( const p of providerReqs ) postToParent( { type: 'strata:activate-provider', provider: p } );

		}

		// §3: an optional `config.settings` export declared beside `init` —
		// never a third mandatory file. The host renders the actual UI (trust
		// boundary: sandbox only ever declares + consumes, never draws host
		// chrome); this round-trip always happens, even with an empty/missing
		// schema, so the host can reliably clear a PREVIOUS game's Settings tab
		// on a Save that switches to a game without any.
		const schema = ( mod.config && Array.isArray( mod.config.settings ) ) ? mod.config.settings : [];
		settingsValues = await requestSettingsValues( schema );
		ctx.settings = settingsValues;

		currentScene = scene;

		await mod.default( ctx );

		postToParent( { type: 'strata:loaded' } );

	}

	// ── One-time harness setup (renderer/camera/canvas/audio/XR/gate/pause/
	// animation-loop) — runs exactly once per sandbox document; see
	// `bootedOnce` at the bottom. Ends by calling loadGame() for the very
	// first load.
	async function bootHarnessOnce( initMsg ) {

		audioCtx = new ( window.AudioContext || window.webkitAudioContext )();
		masterGain = audioCtx.createGain();
		masterGain.gain.value = initMsg.muted ? 0 : 1;
		masterGain.connect( audioCtx.destination );

		canvas = document.createElement( 'canvas' );
		// Focusable + proactively focused: a keydown only ever reaches THIS
		// document if it already has focus, and nothing else does that for an
		// iframe automatically — without this, "press any key to start" would
		// silently do nothing until the player clicked first anyway.
		canvas.tabIndex = -1;
		document.body.appendChild( canvas );
		canvas.focus();

		camera = new THREE.PerspectiveCamera( 50, innerWidth / innerHeight, 0.05, 1000 );

		renderer = new THREE.WebGLRenderer( { canvas, antialias: true } );
		renderer.setPixelRatio( Math.min( devicePixelRatio || 1, 2 ) );
		renderer.setSize( innerWidth, innerHeight );
		renderer.outputColorSpace = THREE.SRGBColorSpace;

		// WebXR (strata-play standard, every game — never per-game code): any
		// scene is automatically playable in VR/AR headsets with zero game-side
		// work. Buttons only ever appear when the browser actually reports
		// support (`isSessionSupported`), so a desktop/mobile visitor with no
		// XR runtime never sees a dead button.
		renderer.xr.enabled = true;
		if ( navigator.xr ) {

			navigator.xr.isSessionSupported( 'immersive-vr' ).then( ( ok ) => { if ( ok ) document.body.appendChild( VRButton.createButton( renderer ) ); } ).catch( () => {} );
			// Both buttons use three's own identical fixed "bottom center"
			// styling, so a device supporting both sessions gets two buttons
			// stacked directly on top of each other unless one is nudged —
			// stack the AR button above the VR button instead of overlapping.
			navigator.xr.isSessionSupported( 'immersive-ar' ).then( ( ok ) => {

				if ( ! ok ) return;
				const arButton = ARButton.createButton( renderer );
				arButton.style.bottom = '74px';
				document.body.appendChild( arButton );

			} ).catch( () => {} );

		}

		// The harness owns the SINGLE `window` resize listener — a game
		// registers via ctx.onResize(fn) instead of adding its own, so a
		// repeated Save never stacks a second/third/… listener.
		window.addEventListener( 'resize', () => {

			camera.aspect = innerWidth / innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize( innerWidth, innerHeight );
			for ( const fn of resizeCallbacks ) { try { fn(); } catch ( e ) { console.error( e ); } }

		} );

		// ── Click-to-play gate (strata-play standard, every game, never per-game
		// code): game logic (onFrame/physics) never advances until a real user
		// gesture — avoids audio-autoplay-policy failures for any game that adds
		// WebAudio later, and stops input/AI/physics running before the player
		// has actually looked at the scene. Rendering starts immediately (the
		// scene is fully visible behind the prompt) — only the fixed-step loop
		// below is held back. The gesture is strictly device-appropriate, not
		// just device-labeled: a coarse pointer (touch) can't reliably hold a
		// key down, so ONLY tap/click dismisses it there; anything else (mouse
		// + keyboard) has no touch surface to tap, so ONLY a keypress does.
		// Entering an XR session (or a controller trigger once inside one)
		// opens the gate too — there's no mouse/keyboard/touch at all once a
		// headset is on.
		const isTouch = matchMedia( '(pointer: coarse)' ).matches || navigator.maxTouchPoints > 0;
		const gateLabel = isTouch ? 'Tap to play' : 'Press any key to play';

		const startGate = document.createElement( 'div' );
		startGate.id = 'strata-start-gate';
		startGate.setAttribute( 'role', 'button' );
		startGate.setAttribute( 'aria-label', gateLabel );
		startGate.innerHTML = `<div class="ping">${ gateLabel }</div>`;
		document.body.appendChild( startGate );

		let gateOpen = false;
		const openGate = ( ev ) => { if ( gateOpen ) return; gateOpen = true; startGate.remove(); canvas.focus(); if ( audioCtx.state === 'suspended' ) audioCtx.resume(); if ( ev ) ev.stopImmediatePropagation(); };
		if ( isTouch ) startGate.addEventListener( 'pointerdown', openGate, { once: true } );
		// Capture phase + stopImmediatePropagation: the game's own input.onKey
		// (registered earlier, bubble phase, inside init()) would otherwise ALSO
		// see this exact same keydown — e.g. a bubble-shooter's "Space fires"
		// handler firing an unintended shot on the very keypress that just
		// dismissed the gate. Capture always runs before bubble on the same
		// target regardless of registration order, so this reliably swallows
		// the dismiss keystroke before any game code observes it.
		else window.addEventListener( 'keydown', openGate, { once: true, capture: true } );

		renderer.xr.addEventListener( 'sessionstart', openGate );
		renderer.xr.getController( 0 ).addEventListener( 'selectstart', openGate );
		renderer.xr.getController( 1 ).addEventListener( 'selectstart', openGate );

		// ── Pause on lost focus (strata-play standard, every game, never
		// per-game code): switching tabs/apps, or clicking back into the
		// host's own chrome (e.g. its Menu), stops onFrame/physics the same
		// way the click-to-play gate does — a game left running unattended
		// in a background tab never silently racks up AI/physics/score the
		// player didn't see. Rendering keeps happening so the tab thumbnail/
		// alt-tab preview still shows the scene. Skipped entirely while
		// presenting in an XR session — a headset's compositor can blur the
		// 2D tab even though the player is actively still in VR/AR.
		const pauseOverlay = document.createElement( 'div' );
		pauseOverlay.id = 'strata-pause-overlay';
		pauseOverlay.innerHTML = '<div class="ping">Paused</div>';
		pauseOverlay.hidden = true;
		document.body.appendChild( pauseOverlay );

		let paused = false;
		function setPaused( next ) {

			if ( renderer.xr.isPresenting || next === paused ) return;
			paused = next;
			pauseOverlay.hidden = ! ( paused && gateOpen );

		}

		window.addEventListener( 'blur', () => setPaused( true ) );
		window.addEventListener( 'focus', () => setPaused( false ) );
		document.addEventListener( 'visibilitychange', () => setPaused( document.hidden ) );

		// §5 physics honesty: a REAL fixed-timestep accumulator, not just
		// cannon-es's own internal one — onFrame callbacks (and one physics
		// step) always advance by exactly FIXED_DT regardless of the render
		// framerate, so the same inputs produce the same result on a given
		// pinned build (Playwright-repeatable). Rendering still happens once
		// per frame, decoupled from the logic rate.
		const FIXED_DT = 1 / 60;
		const MAX_CATCHUP_STEPS = 5; // drop catch-up work rather than spiral-of-death after a stall
		let accumulator = 0;
		let last = performance.now();

		// §4.2 resource watchdog — the sandbox isolates REACH (§4.1's CSP),
		// never COMPUTE; a game can still wedge this thread in an infinite
		// loop or a runaway allocation, which this heartbeat can't prevent but
		// at least lets the host DETECT (see play.js's liveness check) and
		// offer the player a way out (tear down the iframe) instead of a tab
		// that's silently gone unresponsive. Posted unconditionally — even
		// while paused/gated — so "intentionally idle" is never confused with
		// "hung"; only an actually-blocked JS thread stops this from firing.
		// Throttled (not posted every single frame) since it only needs to be
		// frequent relative to the host's own liveness-check interval, not the
		// render rate.
		let lastHeartbeatAt = 0;
		function loop( now ) {

			if ( now - lastHeartbeatAt > 250 ) { lastHeartbeatAt = now; postToParent( { type: 'strata:heartbeat' } ); }

			const frameDt = Math.min( ( now - last ) / 1000, 0.25 );
			last = now;

			if ( gateOpen && ! paused ) {

				accumulator += frameDt;

				let steps = 0;
				while ( accumulator >= FIXED_DT && steps < MAX_CATCHUP_STEPS ) {

					for ( const { object3d, body } of kinematicBodies ) {

						body.position.set( object3d.position.x, object3d.position.y, object3d.position.z );
						body.quaternion.set( object3d.quaternion.x, object3d.quaternion.y, object3d.quaternion.z, object3d.quaternion.w );

					}

					if ( world ) world.step( FIXED_DT, FIXED_DT, 1 ); // we ARE the accumulator now — no internal sub-stepping needed

					for ( const { object3d, body } of boundBodies ) {

						object3d.position.set( body.position.x, body.position.y, body.position.z );
						object3d.quaternion.set( body.quaternion.x, body.quaternion.y, body.quaternion.z, body.quaternion.w );

					}

					for ( const fn of frameCallbacks ) { try { fn( FIXED_DT, now / 1000 ); } catch ( e ) { console.error( e ); } }

					accumulator -= FIXED_DT;
					steps ++;

				}

				if ( steps === MAX_CATCHUP_STEPS ) accumulator = 0;

			}

			renderer.render( currentScene, camera );

		}

		// setAnimationLoop (not a manual requestAnimationFrame chain) is the
		// one loop API that transparently drives BOTH a normal rAF cadence and
		// an active WebXR session's own per-frame callback — required for the
		// headset path to render at all once a VR/AR session starts.
		renderer.setAnimationLoop( loop );

		await loadGame( initMsg );

	}

	// ── Handshake ───────────────────────────────────────────────────────────────
	// The FIRST strata:init runs the one-time harness setup above; every LATER
	// one (the menu's Code-tab Save, posted straight to this already-running
	// document — see play.js's saveCode()) only re-runs loadGame(), never a
	// second renderer/canvas/audio-context/click-to-play-gate/etc.
	let bootedOnce = false;

	window.addEventListener( 'message', ( event ) => {

		const msg = event.data;
		if ( ! msg || msg.type !== 'strata:init' ) return;
		if ( ! bootedOnce ) { bootedOnce = true; bootHarnessOnce( msg ).catch( reportError ); }
		else loadGame( msg ).catch( reportError );

	} );

	postToParent( { type: 'strata:ready' } );

	</script>
</body>
</html>
